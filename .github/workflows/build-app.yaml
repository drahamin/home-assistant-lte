name: Build app image
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./lte_manager
      - id: normalize
        name: Normalize app version
        run: |
          version=${{ steps.info.outputs.version }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: home-assistant-lte
          registry-prefix: ghcr.io/drahamin
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./lte_manager
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=Baiamonte LTE
            io.hass.description=Internal Baiamonte LTE operations console for Home Assistant
            io.hass.url=https://github.com/drahamin/home-assistant-lte
          push: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}
  manifest:
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: home-assistant-lte
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ghcr.io/drahamin
