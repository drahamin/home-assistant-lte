name: Baiamonte LTE
version: 0.6.4
slug: lte_lab_manager
description: Operate Baiamonte's production LTE data network for estate cameras, IoT devices, programmable SIMs, EPC, and Nokia radio.
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
image: ghcr.io/drahamin/home-assistant-lte
ingress: true
ingress_port: 8099
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Optional direct web access port (Home Assistant ingress does not require it)
panel_icon: mdi:radio-tower
panel_title: LTE
panel_admin: true
host_network: false
usb: true
udev: true
homeassistant: 2026.4.0
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
options:
  epc_host: 192.0.2.151
  bts_host: 192.0.2.100
  nokia_api_enabled: false
  nokia_api_base_url: https://192.0.2.100
  nokia_api_status_path: /
  nokia_api_cells_path: ""
  nokia_api_alarms_path: ""
  nokia_api_events_path: ""
  nokia_control_enabled: false
  nokia_api_control_path: ""
  nokia_api_username: ""
  nokia_api_password: ""
  nokia_api_tls_verify: false
  epc_type: nextepc
  mongodb_uri: mongodb://192.0.2.151:27017/nextepc
  apn: internet
  ue_subnet: 10.45.0.0/16
  ue_gateway: 10.45.0.1
  subscriber_ip_version: ipv4
  subscriber_mtu: 1420
  subscriber_dns_primary: 1.1.1.1
  subscriber_dns_secondary: 9.9.9.9
  default_qci: 9
  ambr_downlink_mbps: 25
  ambr_uplink_mbps: 10
  epc_uplink_interface: eth0
  epc_routing_management_enabled: false
  epc_ssh_user: root
  epc_ssh_port: 22
  mcc: "001"
  mnc: "01"
  tac: 1
  network_name: Baiamonte LTE
  mme_group_id: 1
  mme_code: 1
  s1ap_port: 36412
  gtpu_port: 2152
  enb_id: 1
  cell_id: 1
  pci: 1
  lte_band: 2
  dl_earfcn: 900
  ul_earfcn: 18900
  channel_bandwidth_mhz: 10
  tx_power_dbm: 0
  access_class: 0
  home_plmn_only: true
  preferred_plmns: "001-01:E-UTRAN"
  forbidden_plmns: ""
  sim_programming_enabled: false
  sim_reader_name: ""
  sim_reader_index: 0
  sim_reader_protocol: auto
  sim_card_type: ""
  sim_adm_key: ""
  sim_adm_format: decimal
  monitor_interval_seconds: 60
  traffic_monitor_interval_seconds: 300
  history_retention_days: 30
  event_retention_days: 90
  communications_enabled: false
  communications_gateway_url: ""
  communications_gateway_token: ""
  sip_gateway_host: ""
  sip_gateway_port: 5060
  sip_transport: tcp
schema:
  epc_host: str
  bts_host: str
  nokia_api_enabled: bool
  nokia_api_base_url: str
  nokia_api_status_path: str
