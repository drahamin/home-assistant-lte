  nokia_api_events_path: str
  nokia_control_enabled: bool
  nokia_api_control_path: str
  nokia_api_username: str
  nokia_api_password: password
  nokia_api_tls_verify: bool
  epc_type: list(nextepc|open5gs|local)
  mongodb_uri: str
  apn: str
  ue_subnet: str
  ue_gateway: str
  subscriber_ip_version: list(ipv4|ipv4v6)
  subscriber_mtu: int
  subscriber_dns_primary: str
  subscriber_dns_secondary: str
  default_qci: int
