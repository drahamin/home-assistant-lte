name: Baiamonte LTE
version: 0.6.0
slug: lte_lab_manager
description: Operate Baiamonte's production LTE data network for estate cameras, IoT devices, programmable SIMs, EPC, and Nokia radio.
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
image: ghcr.io/drahamin/home-assistant-lte
ingress: true
ingress_port: 8099
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Optional direct web access port (Home Assistant ingress does not require it)
panel_icon: mdi:radio-tower
panel_title: LTE
panel_admin: true
host_network: false
usb: true
udev: true
homeassistant: 2026.4.0
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
options:
  epc_host: 192.0.2.151
  bts_host: 192.0.2.100
  epc_type: nextepc
  mongodb_uri: mongodb://192.0.2.151:27017/nextepc
  apn: internet
  ue_subnet: 10.45.0.0/16
  epc_uplink_interface: eth0
  epc_routing_management_enabled: false
  epc_ssh_user: root
  epc_ssh_port: 22
  mcc: "001"
  mnc: "01"
  tac: 1
  sim_programming_enabled: false
  communications_enabled: false
  communications_gateway_url: ""
  communications_gateway_token: ""
  sip_gateway_host: ""
  sip_gateway_port: 5060
  sip_transport: tcp
schema:
  epc_host: str
  bts_host: str
  epc_type: list(nextepc|open5gs|local)
  mongodb_uri: str
  apn: str
  ue_subnet: str
  epc_uplink_interface: str
  epc_routing_management_enabled: bool
  epc_ssh_user: str
  epc_ssh_port: port
  mcc: str
  mnc: str
  tac: int
  sim_programming_enabled: bool
  communications_enabled: bool
  communications_gateway_url: str
  communications_gateway_token: password
  sip_gateway_host: str
  sip_gateway_port: port
  sip_transport: list(tcp|tls)
