configuration:
  epc_host:
    name: EPC address
    description: Address of the NextEPC or Open5GS server.
  bts_host:
    name: Nokia eNodeB address
    description: Management address configured in the FLF21 commissioning file.
  epc_type:
    name: EPC type
    description: Subscriber database format to use, or local for preview and planning.
  mongodb_uri:
    name: Subscriber database URI
    description: MongoDB URI used by NextEPC/Open5GS. Keep this network private.
  apn:
    name: Default APN
  mcc:
    name: MCC
  mnc:
    name: MNC
  tac:
    name: Tracking area code
  sim_service_provider_name:
    name: SIM friendly network name
    description: 1–16 character name written to EF.SPN on supported programmable SIMs (default rNET).
  sim_programming_enabled:
    name: Enable physical SIM writes
    description: Requires a compatible PC/SC reader and pySim-shell. Writes still require confirmation.
  sim_card_type:
    name: pySim card type
    description: Optional exact pySim model name; leave blank for safe automatic detection.
  sim_adm_key:
    name: SIM ADM credential
    description: Card-vendor programming credential stored privately in Home Assistant.
  sim_adm_format:
    name: SIM ADM format
    description: Select decimal digits or a 16-character hexadecimal ADM credential.
  monitor_interval_seconds:
    name: Network monitor interval
    description: Seconds between background availability checks (30–900 recommended).
  traffic_monitor_interval_seconds:
    name: Traffic graph interval
    description: Seconds between measured EPC traffic-counter samples (60–3600).
  history_retention_days:
    name: Connection history retention
    description: Days of network-status samples to keep locally.
  event_retention_days:
    name: Activity retention
    description: Days of operational activity entries to keep locally.
